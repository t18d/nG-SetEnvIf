# This is a basic workflow to help you get started with Actions

name: ReDoS detector

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "staging" branch
  push:
    branches:
      - 'develop'
    paths: 
      - '8g-firewall.conf'
      - '.github/workflows/redos-detector.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE on the staging branch
      - uses: actions/checkout@v7

      # Install Rust toolchain to use cargo
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo binaries to speed up subsequent workflow runs
      - name: Cache Cargo binaries
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-rxray

      # Installs rxray from crates.io via cargo
      - name: Install rxray
        run: |
          if ! command -v rxray &> /dev/null; then
            cargo install rxray
          fi

      # Runs your loop logic in parallel across available CPU cores
      - name: Run rxray ReDoS analysis
        run: |
          run_analysis() {
            line="$1"
            regex=$(printf '%s\n' "$line" | sed 's/.*~\*//; s/" [0-9][0-9]*;$//')
            printf -v q '%q' "$regex"
          
            eval "rxray $q >/dev/null 2>&1" && return 0
            status=$?
            [ "$status" -eq 1 ] && printf '%s\n' "$regex"
            return 0
          }
          export -f run_analysis
          parallel -j+0 run_analysis {} :::: 8g-firewall.conf
